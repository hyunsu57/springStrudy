// Gradle 설정 파일. 어떤 저장소에서 플러그인을 받을지와 프로젝트 이름을 정한다.
// Spring Boot 4.2.0-SNAPSHOT 플러그인은 Gradle 플러그인 포털이 아니라 Spring 스냅샷 저장소에만 있으므로
// 빌드 스크립트(build.gradle)가 아니라 여기 pluginManagement 에 저장소를 적어야 플러그인을 찾을 수 있다.
pluginManagement {
	repositories {
		maven { url = 'https://repo.spring.io/milestone' }
		maven { url = 'https://repo.spring.io/snapshot' }
		gradlePluginPortal()
	}
}

rootProject.name = 'spring-ai-lab'
