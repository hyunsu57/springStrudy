spring.application.name=spring-ai-lab

# ---- Spring AI 자동 설정 끄기 ----
# Anthropic 스타터의 자동 설정(AnthropicChatAutoConfiguration)은 이 값이 "anthropic"일 때만 동작한다(기본값).
# 자동 설정이 만드는 ChatModel 빈은 앱 시작 시점의 키로 고정되어 키를 바꾸려면 재시작해야 한다.
# 그래서 여기서 끄고, 모델 객체는 AnthropicChatModelProvider 가 키가 바뀔 때마다 직접 다시 만든다.
spring.ai.model.chat=none

# ---- API 키 저장 파일 ----
# 첫 실행 화면에서 입력받은 키를 저장하는 파일. 실행 위치(프로젝트 루트) 기준 상대경로이며 .gitignore 로 제외한다.
# src/main/resources 가 아닌 이유: 실행 중인 앱은 빌드 사본(build/resources/main)이나 JAR 내부를 읽고, JAR 안에는 쓸 수 없으며, src/ 는 커밋된다.
app.secrets.file=./config/secrets.properties
# 파일에 키가 없을 때 대신 읽을 환경 변수 이름 (Anthropic SDK 가 기본으로 보는 이름과 같게 둔다)
app.secrets.env-name=ANTHROPIC_API_KEY

# ---- 모델 설정 ----
# 기본 모델. 비용을 낮추려면 claude-sonnet-5-5 또는 claude-haiku-5-5 로 바꾼다.
app.ai.anthropic.model=claude-opus-5-5
# 한 번의 답변에서 생성할 최대 토큰 수. 요약 실습이라 작게 둔다.
app.ai.anthropic.max-tokens=1024

# ChatClient.Builder 자동 설정도 끈다. 위에서 채팅 모델 자동 설정을 껐기 때문에 ChatModel 빈이 없고,
# 그 상태에서 누군가 ChatClient.Builder 를 주입받으면 "ChatModel 빈 없음"으로 시작이 실패한다(반증 검토자 실측).
# 이 프로젝트는 요청마다 ChatClient.create(현재 모델) 로 직접 만들므로 자동 설정 빌더가 필요 없다.
spring.ai.chat.client.enabled=false
